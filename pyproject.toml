[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "conngraph"
version         = "0.3.0"
description     = "Graph-theory metrics, group statistics and reports for brain connectivity matrices from fMRI and fNIRS pipelines"
readme          = "README.md"
requires-python = ">=3.10"
license         = "Apache-2.0"
license-files   = ["LICENSE"]
authors = [
    { name = "Qiuyu Yu", email = "qiuyuyu.psych@gmail.com" },
]
maintainers = [
    { name = "Qiuyu Yu", email = "qiuyuyu.psych@gmail.com" },
]

dependencies = [
    "vedo>=2024.5.0",
    "nibabel>=5.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "networkx>=3.4",
    "scipy>=1.10",
    "Pillow>=9.0",
    "imageio>=2.20",
    "plotly>=5.18",
    "jinja2>=3.1",
    "bibtexparser>=2.0",
    "nilearn>=0.10",
    "tomli>=2.0; python_version < '3.11'",
    "bctpy>=0.6",
    "topcorr>=0.5",
    "templateflow>=24.0",
    "openpyxl>=3.0",
    "k3d>=3.0",
]

[project.scripts]
conngraph = "conngraph.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"conngraph" = ["config/*.json"]
"conngraph.report" = ["data/*", "templates/*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F", "UP"]
