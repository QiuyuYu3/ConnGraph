[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "brainnet3d"
version         = "0.1.0"
description     = "Interactive 3-D brain network plots and graph-theory metrics for connectivity matrices"
readme          = "README.md"
requires-python = ">=3.10"
license         = "Apache-2.0"
license-files   = ["LICENSE"]
authors = [
    { name = "Qiuyu Yu", email = "qiuyuyu.psych@gmail.com" },
]
maintainers = [
    { name = "Qiuyu Yu", email = "qiuyuyu.psych@gmail.com" },
]

dependencies = [
    "vedo>=2024.5.0",
    "nibabel>=5.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "scipy>=1.10",
    "Pillow>=9.0",
    "imageio>=2.20",
]

[project.optional-dependencies]
graph = [
    "bctpy>=0.6",
    "topcorr>=0.5",
]
atlas = [
    "templateflow>=24.0",
    "openpyxl>=3.0",
]
html = [
    "k3d>=3.0",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"brainnet3d" = ["config/*.json"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F", "UP"]
