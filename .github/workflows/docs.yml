name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # VTK needs an X display and a software OpenGL driver for the brain figures
      - name: Install system libraries for off-screen rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]"
      # the Gordon node table and the fsLR surfaces the examples download on first use
      - name: Cache downloaded data
        uses: actions/cache@v6
        with:
          path: |
            ~/conngraph_data
            ~/.cache/templateflow
          key: conngraph-data-v1
      - name: Build the site and run the gallery examples
        run: xvfb-run -a python -m sphinx -b html -W --keep-going docs docs/_build/html
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
