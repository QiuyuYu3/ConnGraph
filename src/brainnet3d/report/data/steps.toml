# ---- metrics ----

[metrics_intro]
plain = "Graph theory metrics were computed following the Brain Connectivity Toolbox (BCT; {cite_bare:Rubinov2010})."

[def_clust_coeff]
plain = "The clustering coefficient quantifies local cliquishness, the degree to which a node's neighbors are interconnected."

["clust_coeff.costantini"]
plain = "It was computed with the signed-weight generalization {cite:Costantini2014}, which retains the original positive and negative edge weights."

# TODO: review wording
["clust_coeff.zhang"]
plain = "The Zhang and Horvath generalization was computed on the absolute weights {todo:the Zhang and Horvath clustering coefficient}."

# TODO: review wording
["clust_coeff.onnela"]
plain = "The weighted clustering coefficient based on the geometric mean of triangle weights was computed on the absolute weights {todo:the Onnela clustering coefficient}."

# TODO: review wording
["clust_coeff.bin"]
plain = "A binary clustering coefficient was computed on the unweighted graph."

[remaining_abs]
plain = "The remaining {count} were computed on the absolute values of the edge weights."

["strength.abs"]
plain = "Strength (absolute strength) is the sum of the absolute edge weights incident to a node, reflecting its total weighted connectivity."

# TODO: review wording
["strength.pos"]
plain = "Positive strength is the sum of a node's positive edge weights."

# TODO: review wording
["strength.neg"]
plain = "Negative strength is the sum of the magnitudes of a node's negative edge weights."

# TODO: review wording
["strength.bin"]
plain = "Degree is the number of edges of a node."

[def_btwn_cent]
plain = "Betweenness centrality counts the shortest paths in the network that pass through a given node, capturing its importance as a relay or bridge."

["btwn_cent.inv"]
plain = "For this metric, the absolute weights were first converted to connection lengths (their inverse), with stronger connections corresponding to shorter distances; values were not normalized."

# TODO: review wording
["btwn_cent.inv_norm"]
plain = "Connection lengths were the inverse of the absolute weights, and values were divided by (N − 1)(N − 2)."

# TODO: review wording
["btwn_cent.log"]
plain = "Connection lengths were the negative logarithm of the absolute weights {todo:logarithmic connection lengths}; values were not normalized."

# TODO: review wording
["btwn_cent.log_norm"]
plain = "Connection lengths were the negative logarithm of the absolute weights {todo:logarithmic connection lengths}, and values were divided by (N − 1)(N − 2)."

# TODO: review wording
["btwn_cent.bin"]
plain = "A binary betweenness centrality was computed on the unweighted graph."

[def_ge_local]
plain = "Local efficiency quantifies the efficiency of information transfer within a node's immediate neighborhood, computed as the average inverse shortest path length among its direct neighbors {cite:Rubinov2010}."

# TODO: review wording
["ge_local.wang"]
plain = "{todo:the weighted generalization of local efficiency used}"

# TODO: review wording
["ge_local.rubinov"]
plain = "The original weighted definition was used."

# TODO: review wording
["ge_local.bin"]
plain = "A binary local efficiency was computed on the unweighted graph."

# TODO: review wording
[random]
plain = "Each metric was also divided by its mean over {n} random networks that preserved each node's numbers of positive and negative edges, with weights redistributed within each sign {todo:the null model}."

# ---- levels ----

[levels]
plain = "Analyses were conducted at {count}."

[level_node]
plain = "At the node level, metrics were computed for each of the {n} parcels{atlas}."

# TODO: review wording
[level_node_channels]
plain = "At the node level, metrics were computed for each of the {n} channels."

[level_network]
plain = "At the network level, {z} was averaged within and between each of the {n} networks{back}, and the same graph construction and metrics were applied to the resulting {n} × {n} network matrix."

[level_network_hemi]
plain = "At the hemisphere-separated network level, left- and right-hemisphere ROIs of each network were treated as separate nodes ({n} × {n} matrix)."

# TODO: review wording
[level_network_hemi_alone]
