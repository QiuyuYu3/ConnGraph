[graph_omst]
plain = "The diagonal of each matrix was set to zero, and a graph was constructed for each participant from orthogonal minimum spanning trees {todo:orthogonal minimum spanning trees}: spanning trees were added one at a time, and the set that maximized global efficiency minus cost was kept."

