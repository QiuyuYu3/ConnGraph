# Sentence templates for the generated Methods text.
#
# {name} slots are filled from the run record. Citation slots:
#   {cite:Key1,Key2}  parenthetical citation, e.g. (Rubinov & Sporns, 2010)
#   {cite_bare:Key}   citation without its own parentheses, for use inside a parenthesis
#   {todo:what}       a reference still to be chosen, shown as [TODO: reference for what]
# Keys refer to entries in references.bib.

# ---- graph metrics: input ----

[input]
plain = "Functional connectivity matrices{source} were used as input for graph theory analysis, performed with brainnet3d v{ver}."

[participants]
plain = "Matrices were loaded for {n} participants."

[bad_nodes]
plain = "Nodes for which more than {pct}% of connectivity values were missing in {scope} were excluded across all participants."

# TODO: review wording
[bad_series]
plain = "Nodes whose time series had missing or constant values in {scope} were excluded across all participants."

# TODO: review wording
[combine_runs]
plain = "For the {n} participants with more than one run, the regional time series of each run were z-scored and concatenated in run order before connectivity was estimated."

# TODO: review wording
[connectivity]
plain = "Connectivity was estimated as {measure} with nilearn v{ver} {todo:nilearn}."

# TODO: review wording
[connectivity_shrinkage]
plain = "Connectivity was estimated as {measure} with nilearn v{ver} {todo:nilearn}, using Ledoit-Wolf shrinkage of the covariance {todo:Ledoit-Wolf shrinkage}."

# TODO: review wording
[values_z]
plain = "The input matrices contained Fisher z values, which were converted back to correlation coefficients."

# ---- graph construction ----

[graph_tmfg]
plain = "The diagonal of each matrix was set to zero, and a sparse graph was constructed for each participant using the Triangulated Maximally Filtered Graph (TMFG) algorithm {todo:the TMFG method}, a topology-based sparsification method that preserves planarity and key topological features of the connectivity matrix while controlling graph density."

[why_tmfg]
plain = "Compared with proportional thresholding {cite:vandenHeuvel2017}, TMFG was preferred because it guarantees a single connected component and preserves weak but informative edges, properties that improve the reliability of derived graph metrics and the sensitivity to individual differences {cite:Jiang2023}."

# TODO: review wording
[graph_full]
plain = "The diagonal of each matrix was set to zero, and every edge was kept, giving a fully connected weighted graph for each participant."

# TODO: review wording
[graph_absolute]
plain = "The diagonal of each matrix was set to zero, and a graph was constructed for each participant by keeping the edges whose absolute weight was at least {value}."

# TODO: review wording
[graph_density]
plain = "The diagonal of each matrix was set to zero, and a graph was constructed for each participant by keeping the strongest edges up to a density of {value}."

# TODO: review wording
[graph_eco]
plain = "The diagonal of each matrix was set to zero, and a graph was constructed for each participant by keeping the strongest edges up to the density that gives an average degree of 3 {todo:efficiency cost optimization}."

# TODO: review wording
[graph_knn]
plain = "The diagonal of each matrix was set to zero, and a graph was constructed for each participant by keeping the {value} strongest edges of every node."

