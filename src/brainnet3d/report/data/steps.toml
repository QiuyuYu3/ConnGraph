[graph_mst]
plain = "The diagonal of each matrix was set to zero, and the maximum spanning tree of each participant's matrix was used as the graph {todo:minimum spanning tree analysis}."

# TODO: review wording
[graph_mst_density]
plain = "The diagonal of each matrix was set to zero, and a graph was constructed for each participant from the maximum spanning tree plus the strongest remaining edges up to a density of {value}."

